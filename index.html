<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4B2FB0">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>원고지 타자 연습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;600&family=Jua&display=swap" rel="stylesheet">

<!-- ======================= CSS: 화면 꾸미기 ======================= -->
<style>
  /* 색깔 모음 (여기 숫자만 바꾸면 전체 색이 바뀌어요) */
  :root {
    --paper: #EEF3EC;    /* 배경 (원고지 종이) */
    --line: #7FAE88;     /* 원고지 칸 선 */
    --grid: #DCE8DE;     /* 게임 화면 모눈 */
    --ink: #1F2A24;      /* 맞게 친 글자 */
    --faint: #A3B7A8;    /* 아직 안 친 글자 (흐리게) */
    --wrong: #C8332F;    /* 틀린 글자 */
    --wrong-bg: #F6DCD8; /* 틀린 칸 배경 */
    --mark: #F5D76E;     /* 지금 칠 칸 (형광펜) */
    --panel: #FFFFFF;    /* 입력창·카드 배경 */
    --ghost: #8A7FC2;    /* 고스트(과거의 나) 색 */
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #141C17; --line: #3F6E4B; --grid: #22322A; --ink: #E4EDE6; --faint: #4E6356;
      --wrong: #FF6B63; --wrong-bg: #3A1E1C; --mark: #6B5A1E; --panel: #1C261F; --ghost: #A99DE8;
    }
  }
  :root[data-theme="dark"] {
    --paper: #141C17; --line: #3F6E4B; --grid: #22322A; --ink: #E4EDE6; --faint: #4E6356;
    --wrong: #FF6B63; --wrong-bg: #3A1E1C; --mark: #6B5A1E; --panel: #1C261F; --ghost: #A99DE8;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    min-height: 100%; margin: 0;
    background: var(--paper); color: var(--ink);
    font-family: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  .app { max-width: 640px; margin: 0 auto; padding: 1.25rem 1rem 2rem; }
  .screen { display: flex; flex-direction: column; gap: 1.1rem; }
  [hidden] { display: none !important; }

  /* ---------- 공통 버튼 ---------- */
  .row { display: flex; gap: 0.6rem; }
  .btn {
    flex: 1; font: inherit; font-weight: 600; padding: 0.8rem; border-radius: 10px; cursor: pointer;
    border: 2px solid var(--ink); background: var(--ink); color: var(--paper);
  }
  .btn.ghost { background: transparent; color: var(--ink); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .choice:focus-visible, .btn:focus-visible, .tabs button:focus-visible, .back:focus-visible { outline: 3px solid var(--mark); outline-offset: 2px; }
  input {
    width: 100%; font: inherit; font-size: 1.2rem; color: var(--ink);
    background: var(--panel); border: 2px solid var(--line); border-radius: 10px; padding: 0.8rem;
  }
  input:focus { outline: 3px solid var(--mark); outline-offset: 1px; }
  .row input { flex: 1; min-width: 0; }
  .msg { min-height: 1.5em; margin: 0; font-size: 0.95rem; }
  .msg.err { color: var(--wrong); }

  /* ---------- 로비 ---------- */
  .logo { display: flex; margin-top: 1.5rem; }
  .logo span {
    width: 3.6rem; aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--line); margin-left: -2px; background: var(--panel);
    font-family: "Gowun Batang", serif; font-weight: 700; font-size: 2.2rem;
  }
  .logo span:first-child { margin-left: 0; }
  .logo span.hl { background: var(--mark); }
  .tagline { margin: 0; opacity: 0.75; }

  .tabs { display: flex; border: 2px solid var(--line); border-radius: 999px; overflow: hidden; }
  .tabs button {
    flex: 1; border: 0; background: transparent; color: var(--ink); font: inherit; font-weight: 600;
    padding: 0.6rem 0.5rem; cursor: pointer;
  }
  .tabs button.on { background: var(--line); color: var(--paper); }

  .choices { display: flex; flex-direction: column; gap: 0.7rem; }
  .choice {
    display: block; width: 100%; text-align: left; cursor: pointer; font: inherit; color: var(--ink);
    background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 1rem 1.1rem;
  }
  .choice strong { display: block; font-family: "Gowun Batang", serif; font-size: 1.35rem; margin-bottom: 0.2rem; }
  .choice small { opacity: 0.75; font-size: 0.9rem; }
  .choice.game { border-color: var(--ink); border-width: 2px; box-shadow: 4px 4px 0 var(--mark); }
  .piece-list { display: flex; flex-direction: column; gap: 0.5rem; padding-left: 0.9rem; border-left: 3px solid var(--mark); }
  .piece-list .choice { padding: 0.75rem 1rem; }
  .piece-list .choice strong { font-size: 1.1rem; }
  .best { font-size: 0.9rem; opacity: 0.8; margin: 0; }

  /* 내 문장 관리 */
  .btn.add { flex: 0 0 auto; padding: 0.8rem 1.2rem; }
  .meter { height: 0.7rem; border: 2px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--panel); }
  .meter div { height: 100%; width: 0; background: var(--line); transition: width 0.3s; }
  .meter.full div { background: var(--mark); }
  .mine-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .mine-list li {
    display: flex; align-items: center; gap: 0.6rem; padding: 0.6rem 0.2rem;
    border-bottom: 1px solid var(--line); font-family: "Gowun Batang", serif; font-size: 1.05rem;
  }
  .mine-list li span.num { font-family: "IBM Plex Sans KR", sans-serif; font-size: 0.8rem; opacity: 0.6; width: 1.6rem; flex: 0 0 auto; }
  .mine-list li span.text { flex: 1; overflow-wrap: anywhere; }
  .mine-list li button {
    flex: 0 0 auto; border: 1px solid var(--wrong); color: var(--wrong); background: transparent;
    border-radius: 6px; font-family: "IBM Plex Sans KR", sans-serif; font-size: 0.8rem; padding: 0.25rem 0.55rem; cursor: pointer;
  }

  /* ---------- 연습 화면 ---------- */
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 0.8rem; }
  .back { border: 0; background: transparent; color: var(--ink); font: inherit; font-weight: 600; padding: 0.4rem 0; cursor: pointer; }
  .piece-title { font-family: "Gowun Batang", serif; font-weight: 700; font-size: 1.15rem; margin: 0; text-align: right; }
  .stats { display: flex; gap: 1.5rem; font-size: 0.95rem; }
  .stats b { font-size: 1.35rem; font-variant-numeric: tabular-nums; margin-right: 0.2rem; }
  .sheet {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(2.3rem, 1fr));
    border-top: 2px solid var(--line); border-left: 2px solid var(--line);
    background: var(--panel); cursor: text;
  }
  .cell {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
    font-family: "Gowun Batang", serif; font-size: 1.45rem; color: var(--faint);
  }
  .cell.ok { color: var(--ink); }
  .cell.bad { color: var(--wrong); background: var(--wrong-bg); }
  .cell.now { background: var(--mark); }
  .cell.composing { color: var(--ink); opacity: 0.6; }
  .cell { position: relative; }
  .cell.ghost { box-shadow: inset 0 0 0 3px var(--ghost); }
  .cell.ghost::after {
    content: "👻"; position: absolute; top: -0.2rem; right: -0.1rem; font-size: 0.75rem;
    animation: float 0.8s ease-in-out infinite alternate;
  }
  @keyframes float { to { transform: translateY(-3px); } }
  .ghost-info { margin: -0.4rem 0 0; min-height: 1.4em; font-size: 0.95rem; color: var(--ghost); font-weight: 600; }
  .next-line { margin: 0.5rem 0 0; font-family: "Gowun Batang", serif; color: var(--faint); font-size: 1.05rem; }
  .summary { border: 2px solid var(--line); border-radius: 10px; padding: 1rem; background: var(--panel); display: flex; flex-direction: column; gap: 0.8rem; }
  .summary h2 { font-family: "Gowun Batang", serif; margin: 0; font-size: 1.3rem; }
  .summary p { margin: 0; }

  /* ---------- 게임: 타자 디펜스 ---------- */
  #game { gap: 0.7rem; }
  .hud { display: flex; align-items: baseline; gap: 1.1rem; font-size: 0.95rem; }
  .hud b { font-size: 1.25rem; font-variant-numeric: tabular-nums; }
  .hp { color: var(--wrong); letter-spacing: 0.1em; font-size: 1.1rem; }
  .combo { margin-left: auto; font-weight: 600; }
  .field {
    position: relative; overflow: hidden;
    height: clamp(190px, 44vh, 380px); height: clamp(190px, 44dvh, 380px);
    border: 2px solid var(--line); border-radius: 12px; background-color: var(--panel);
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 1.8rem 1.8rem;
  }
  .castle {
    position: absolute; left: 0; top: 0; bottom: 0; width: 13%;
    display: flex; align-items: center; justify-content: center; font-size: 1.9rem;
    border-right: 2px dashed var(--line); background: var(--paper); transition: background 0.15s;
  }
  .castle.hit { background: var(--wrong-bg); }
  .castle.fire { background: var(--mark); }
  .enemy {
    position: absolute; transform: translateY(-50%); display: flex; align-items: center; gap: 0.2rem;
    white-space: nowrap; font-family: "Gowun Batang", serif; font-size: 1.05rem; will-change: left;
  }
  .enemy .mon { font-size: 1.35rem; }
  .enemy .word { background: var(--panel); border: 1.5px solid var(--line); border-radius: 6px; padding: 0.1rem 0.4rem; }
  .enemy.target .word { background: var(--mark); border-color: var(--ink); }
  .enemy.dead { animation: pop 0.3s forwards; }
  @keyframes pop { to { transform: translateY(-50%) scale(1.6); opacity: 0; } }
  .shot {
    position: absolute; height: 3px; background: var(--ink); transform: translateY(-50%);
    transform-origin: left center; animation: shot 0.18s forwards;
  }
  @keyframes shot { from { opacity: 1; } to { opacity: 0; } }
  .toast {
    position: absolute; left: 50%; top: 12%; transform: translateX(-50%);
    background: var(--ink); color: var(--paper); font-weight: 600; padding: 0.3rem 0.8rem; border-radius: 999px;
  }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 0.6rem; padding: 1rem; text-align: center;
    background: color-mix(in srgb, var(--paper) 90%, transparent);
  }
  .overlay h2 { font-family: "Gowun Batang", serif; margin: 0; font-size: 1.6rem; }
  .overlay p { margin: 0; max-width: 22rem; line-height: 1.5; white-space: pre-line; }
  .overlay .row { width: min(100%, 20rem); }
  .enemy.special .word { border: 2px solid var(--ink); font-weight: 700; }
  .enemy.special .mon { animation: bob 0.6s ease-in-out infinite alternate; }
  @keyframes bob { to { transform: translateY(-4px); } }
  .field.frozen { background-color: color-mix(in srgb, var(--panel) 70%, #8FC8E8); }
  .settings { gap: 0.5rem; flex-wrap: wrap; }
  .settings .btn { min-width: 8.5rem; }
  .settings .btn { padding: 0.55rem; font-size: 0.9rem; border-width: 1.5px; }
  .shake { animation: shake 0.25s; }


  /* ---------- 끝말잇기 배틀 ---------- */
  .timer { height: 0.8rem; border: 2px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--panel); }
  .timer div { height: 100%; width: 100%; background: var(--line); }
  .timer.warn div { background: var(--wrong); }
  .chain-log {
    display: flex; flex-direction: column; gap: 0.45rem; padding: 0.8rem; overflow-y: auto;
    height: clamp(140px, 30vh, 300px); height: clamp(140px, 30dvh, 300px);
    border: 2px solid var(--line); border-radius: 12px; background-color: var(--panel);
    background-image: linear-gradient(var(--grid) 1px, transparent 1px); background-size: 100% 1.8rem;
  }
  .bubble {
    max-width: 75%; padding: 0.35rem 0.75rem; border-radius: 12px; border: 1.5px solid var(--line);
    font-family: "Gowun Batang", serif; font-size: 1.2rem; background: var(--paper);
  }
  .bubble.cpu { align-self: flex-start; border-bottom-left-radius: 3px; }
  .bubble.me { align-self: flex-end; border-bottom-right-radius: 3px; background: var(--mark); border-color: var(--ink); }
  .bubble.sys { align-self: center; font-family: "IBM Plex Sans KR", sans-serif; font-size: 0.85rem; border-style: dashed; background: transparent; }
  .bubble b { color: var(--wrong); }
  .bubble small { font-family: "IBM Plex Sans KR", sans-serif; font-size: 0.75rem; opacity: 0.7; margin-left: 0.3rem; }
  .next-syl { display: flex; align-items: center; gap: 0.8rem; }
  .next-syl .big {
    width: 3.4rem; aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--ink); background: var(--mark); font-family: "Gowun Batang", serif; font-weight: 700; font-size: 2rem;
  }
  .next-syl p { margin: 0; font-size: 0.95rem; }

  /* ---------- 통계 ---------- */
  .card { background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 1rem; display: flex; flex-direction: column; gap: 0.7rem; }
  .card h3 { margin: 0; font-family: "Gowun Batang", serif; font-size: 1.15rem; }
  .card .note { margin: 0; font-size: 0.85rem; opacity: 0.7; }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
  .stat-grid div { border: 1px solid var(--line); border-radius: 8px; padding: 0.55rem 0.4rem; text-align: center; }
  .stat-grid b { display: block; font-size: 1.3rem; font-variant-numeric: tabular-nums; }
  .stat-grid span { font-size: 0.8rem; opacity: 0.75; }
  .chart { width: 100%; height: auto; display: block; }
  .chart .axis { stroke: var(--grid); stroke-width: 1; }
  .chart .line { fill: none; stroke: var(--line); stroke-width: 2.5; stroke-linejoin: round; }
  .chart .dot { fill: var(--panel); stroke: var(--ink); stroke-width: 1.5; }
  .chart text { fill: var(--ink); font-size: 9px; opacity: 0.7; font-family: "IBM Plex Sans KR", sans-serif; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { padding: 0.45rem 0.35rem; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
  th { font-weight: 600; opacity: 0.75; font-size: 0.8rem; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .chips { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .chips span {
    display: inline-flex; align-items: baseline; gap: 0.35rem; border: 1.5px solid var(--wrong);
    border-radius: 8px; padding: 0.3rem 0.6rem; background: var(--wrong-bg);
  }
  .chips b { font-family: "Gowun Batang", serif; font-size: 1.3rem; color: var(--wrong); }
  .chips small { font-size: 0.8rem; }
  .btn.danger { border-color: var(--wrong); color: var(--wrong); background: transparent; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }


  /* ======================= 보라색 게임 테마 ======================= */
  /* ★ 색깔 모음: 보라 + 노랑 포인트 */
  :root {
    --paper: #F1ECFF;  --panel: #FFFFFF;  --line: #7B5CE0;  --grid: #E4DBFB;
    --ink: #2A1B4D;    --faint: #B3A3E2;  --wrong: #E5484D; --wrong-bg: #FFE1E3;
    --mark: #FFD54A;   --ghost: #00A9BD;
    --deep: #4B2FB0;   --bright: #9B7BFF; /* 진한 보라, 밝은 보라 */
    --font-game: "Jua", "IBM Plex Sans KR", "Apple SD Gothic Neo", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #160F2C; --panel: #221A40; --line: #8C6CFF; --grid: #2F2654;
      --ink: #F1ECFF;   --faint: #5F548C; --wrong: #FF6B70; --wrong-bg: #3D1C2A;
      --mark: #F2C230;  --ghost: #3FD6E6; --deep: #2E1A7A; --bright: #A88BFF;
    }
  }
  :root[data-theme="dark"] {
    --paper: #160F2C; --panel: #221A40; --line: #8C6CFF; --grid: #2F2654;
    --ink: #F1ECFF;   --faint: #5F548C; --wrong: #FF6B70; --wrong-bg: #3D1C2A;
    --mark: #F2C230;  --ghost: #3FD6E6; --deep: #2E1A7A; --bright: #A88BFF;
  }

  /* 배경: 위쪽은 보라 하늘, 반짝이 점 */
  body {
    background:
      radial-gradient(circle at 15% 8%, rgba(255,255,255,0.35) 0 2px, transparent 3px) 0 0 / 90px 90px,
      radial-gradient(circle at 70% 40%, rgba(255,255,255,0.25) 0 1.5px, transparent 2.5px) 0 0 / 130px 130px,
      linear-gradient(180deg, var(--deep) 0, var(--line) 190px, var(--paper) 420px) no-repeat,
      var(--paper);
    background-attachment: scroll;
  }
  h1, h2, h3, .piece-title, .choice strong, .btn, .tabs button, .back, .hud, .stats, .logo span, .toast, .kicker {
    font-family: var(--font-game); font-weight: 400;
  }
  .stats b, .hud b, .stat-grid b { font-family: var(--font-game); font-weight: 400; }

  /* 화면 전환 */
  .screen:not([hidden]) { animation: rise 0.3s cubic-bezier(.2,.9,.3,1.2); }
  .screen .screen:not([hidden]) { animation: none; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px) scale(0.98); } }

  /* 로고: 게임 타일 */
  .logo { gap: 0.35rem; margin-top: 1rem; }
  .logo span {
    margin-left: 0; border: 0; border-radius: 14px; color: #fff; font-size: 2.3rem;
    background: linear-gradient(180deg, var(--bright), var(--line));
    box-shadow: 0 5px 0 var(--deep), 0 8px 14px rgba(30, 10, 80, 0.35);
    animation: tile-in 0.5s cubic-bezier(.3,1.6,.5,1) backwards;
  }
  .logo span:nth-child(2) { animation-delay: 0.06s; }
  .logo span:nth-child(3) { animation-delay: 0.12s; }
  .logo span:nth-child(4) { animation-delay: 0.18s; }
  .logo span.hl { background: linear-gradient(180deg, #FFE380, var(--mark)); color: var(--deep); box-shadow: 0 5px 0 #C99A10, 0 8px 14px rgba(30,10,80,0.35); transform: rotate(-6deg); }
  @keyframes tile-in { from { transform: translateY(-30px) scale(0.6); opacity: 0; } }
  .tagline { color: #fff; opacity: 1; display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; text-shadow: 0 1px 2px rgba(0,0,0,0.25); }
  .kicker {
    background: var(--mark); color: var(--deep); padding: 0.15rem 0.6rem; border-radius: 999px;
    font-size: 0.85rem; box-shadow: 0 3px 0 #C99A10; transform: rotate(-3deg); text-shadow: none;
  }

  /* 탭 */
  .tabs { border: 0; background: rgba(0, 0, 0, 0.18); padding: 4px; gap: 4px; }
  .tabs button { color: #fff; border-radius: 999px; font-size: 1.05rem; transition: background 0.2s, color 0.2s, transform 0.1s; }
  .tabs button.on { background: #fff; color: var(--deep); box-shadow: 0 3px 0 var(--deep); }
  .tabs button:active { transform: translateY(2px); }

  /* 메뉴 카드: 게임 메뉴 버튼처럼 */
  .choice {
    display: flex; align-items: center; gap: 0.9rem; border: 0; border-radius: 18px; padding: 0.9rem 1rem;
    box-shadow: 0 6px 0 var(--grid), 0 10px 18px rgba(40, 20, 100, 0.12);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .choice:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--grid), 0 4px 8px rgba(40,20,100,0.12); }
  .choice strong { font-size: 1.35rem; color: var(--deep); }
  .choice .ico {
    flex: 0 0 auto; width: 3.2rem; aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    border-radius: 14px; color: #fff; font-family: var(--font-game); font-size: 1.8rem;
    background: linear-gradient(180deg, var(--bright), var(--line)); box-shadow: 0 4px 0 var(--deep);
  }
  .choice .txt { flex: 1; min-width: 0; }
  .choice.game { border: 3px solid var(--mark); box-shadow: 0 6px 0 #C99A10, 0 10px 18px rgba(40,20,100,0.15); position: relative; }
  .choice.game:active { box-shadow: 0 2px 0 #C99A10; }
  .choice.game .ico { background: linear-gradient(180deg, #FFE380, var(--mark)); color: var(--deep); box-shadow: 0 4px 0 #C99A10; }
  .choice.game::after {
    content: "GAME"; position: absolute; top: -0.7rem; right: 0.9rem; font-family: var(--font-game);
    background: var(--wrong); color: #fff; font-size: 0.75rem; padding: 0.1rem 0.5rem; border-radius: 999px;

  .overlay { background: rgba(22, 12, 60, 0.72); color: #fff; backdrop-filter: blur(3px); }

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const DOUBLE_VOWELS = [9, 10, 11, 14, 15, 16, 19];
const DOUBLE_FINALS = [3, 5, 6, 9, 10, 11, 12, 13, 14, 15, 18];
function strokeCount(text) {
  let count = 0;
  for (const ch of text) {
    const code = ch.charCodeAt(0);
    if (code >= 0xAC00 && code <= 0xD7A3) {
      const s = code - 0xAC00;
      const vowel = Math.floor(s / 28) % 21;
      const final = s % 28;
      count += 1;
      count += DOUBLE_VOWELS.includes(vowel) ? 2 : 1;
      if (final > 0) count += DOUBLE_FINALS.includes(final) ? 2 : 1;
    } else {
      count += 1;
    }
  }
  return count;
}

// 소리 파일 없이 브라우저가 직접 "삐" 소리를 만들어요 (Web Audio)
let soundOn = true, vibeOn = true, ghostOn = true;
try {
  ghostOn = localStorage.getItem("typing-ghost") !== "off";
  soundOn = localStorage.getItem("typing-sound") !== "off";
  vibeOn = localStorage.getItem("typing-vibe") !== "off";
} catch (e) {}
let audioCtx = null;

// freq: 음 높이(Hz), dur: 길이(초), type: 소리 모양, vol: 크기, slideTo: 끝날 때 음 높이
function beep(freq, dur, type = "sine", vol = 0.12, slideTo = null) {
  if (!soundOn) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + dur);
  } catch (e) {}
}
function buzz(pattern) {
  if (vibeOn && navigator.vibrate) navigator.vibrate(pattern);   // 아이폰은 진동이 안 돼요
}
// ★ 효과음 모음: 숫자를 바꾸면 소리가 달라져요
const SFX = {
  tick()    { beep(880, 0.05, "sine", 0.05); buzz(8); },                           // 글자 하나 맞음
  line()    { beep(660, 0.1); setTimeout(() => beep(990, 0.16), 90); buzz(40); },   // 한 줄 완성
  kill()    { beep(900, 0.12, "square", 0.05, 300); buzz(25); },                    // 몬스터 처치
  special() { [660, 880, 1320].forEach((f, i) => setTimeout(() => beep(f, 0.12, "triangle", 0.1), i * 70)); buzz([30, 40, 30]); },
  levelUp() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.12, "triangle", 0.09), i * 80)); buzz(60); },
  hurt()    { beep(160, 0.25, "sawtooth", 0.08, 80); buzz(150); },                   // 성이 맞음
  win()     { [784, 988, 1175, 1568].forEach((f, i) => setTimeout(() => beep(f, 0.14, "triangle", 0.1), i * 90)); buzz([40, 50, 80]); }  // 고스트 이김
};

// 기록 모양: { total: 걸린 시간(ms), marks: [1번째 칸까지 걸린 시간, 2번째 칸까지..., ...], at: 저장한 날짜 }
const MAX_GHOSTS = 300;      // ★ 저장할 고스트 최대 개수 (넘으면 오래된 것부터 지워요)

function loadGhosts() {
  try { return JSON.parse(localStorage.getItem("typing-ghosts")) || {}; } catch (e) { return {}; }
}
function saveGhost(sentence, record) {
  const all = loadGhosts();
  all[sentence] = record;
  const keys = Object.keys(all);
  if (keys.length > MAX_GHOSTS) {
    keys.sort((a, b) => all[a].at - all[b].at);               // 오래된 순서로 정렬
    keys.slice(0, keys.length - MAX_GHOSTS).forEach((k) => delete all[k]);
  }
  try { localStorage.setItem("typing-ghosts", JSON.stringify(all)); } catch (e) {}
}
const sec = (ms) => (ms / 1000).toFixed(1);   // 1234 → "1.2"

function updateGhost() {
  const box = $("ghostInfo");

  if (!ghost) {
    box.textContent = ghostOn ? "👻 이 문장을 끝내면 고스트가 생겨요" : "";
    cells.forEach((c) => c.classList.remove("ghost"));
    return;
  }
  const n = cells.length;
  let pos = 0;
  if (!startTime) {
    box.textContent = "👻 과거의 나: " + sec(ghost.total) + "초 · 치기 시작하면 출발!";
  } else {
    const elapsed = Date.now() - startTime;
    pos = ghost.marks.filter((t) => t <= elapsed).length;   // 고스트가 지금까지 간 칸 수
    const diff = marks.length - pos;
    if (pos >= n) box.textContent = "👻 과거의 나는 벌써 도착했어요!";
    else if (diff > 0) box.textContent = "👻 과거의 나보다 " + diff + "칸 앞서요";
    else if (diff < 0) box.textContent = "👻 과거의 나보다 " + (-diff) + "칸 뒤처져요";
    else box.textContent = "👻 과거의 나와 나란히!";
  }
  cells.forEach((c, i) => c.classList.toggle("ghost", i === pos && pos < n));
}

// 대충 친 문장 막기: 문제가 있으면 이유를, 괜찮으면 null
function checkSentence(t, list) {
  const chars = Array.from(t.replace(/ /g, ""));
  if (!t) return "문장을 입력해 주세요.";
  if (chars.length < 5) return "띄어쓰기 빼고 5글자 이상 입력해 주세요.";
  if (Array.from(t).length > 40) return "40글자 이하로 입력해 주세요.";
  if (/[\u3131-\u318E]/.test(t)) return "ㅋㅋ, ㅎㅎ 같은 낱자는 쓸 수 없어요.";
  if (!/[가-힣A-Za-z]/.test(t)) return "한글이나 영어가 들어간 문장을 입력해 주세요.";
  if (/(.)\1\1/u.test(t.replace(/ /g, ""))) return "같은 글자를 3번 이상 연달아 쓸 수 없어요.";
  const kinds = new Set(chars).size;
  if (kinds < 4 || kinds / chars.length < 0.4) return "같은 글자만 반복하지 말고 제대로 된 문장을 써 주세요.";
  if (list.includes(t)) return "이미 등록된 문장이에요.";
  return null;
}

function renderMine() {
  const list = loadMine();

      (loadBest("typing-best-mine") ? " · 최고 " + loadBest("typing-best-mine") + "타" : "")
    : n + " / " + MIN_MINE + " · " + (MIN_MINE - n) + "문장 더 등록하면 플레이할 수 있어요";
  $("btnMineStart").disabled = n < MIN_MINE;

  });
}

function addMine() {
  const box = $("mineInput");
  const t = box.value.trim().replace(/\s+/g, " ");

  m.textContent = "등록했어요!";
  m.classList.remove("err");

  renderMine();
  box.focus();
}

function totalXp() {
  let xp = 0;
  loadData("typing-history", []).forEach((h) => { xp += h.lines * 10 + (h.acc >= 95 ? 20 : 0); });
  loadData("typing-games", []).forEach((x) => { xp += x.kills * 3; });

}
function renderPlayer() {

function reset() {
  index = 0; results = []; startTime = null; composing = false; lastCorrect = 0;
  ghostWins = 0; ghostLosses = 0; sessionMs = 0;
  prepareLine();
  input.value = ""; msg.textContent = "";
  $("summary").hidden = true;
  $("practice").hidden = false;
  input.hidden = false;
  $("playButtons").hidden = false;
  render();
  input.focus();
}

function render() {
  const target = Array.from(lines[index]);
  const typed = Array.from(input.value);
  const settled = composing ? typed.length - 1 : typed.length;
  const nowPos = composing ? typed.length - 1 : typed.length;

  // 맞게 친 글자가 늘었으면 "틱" 소리
  let correctNow = 0;
  for (let i = 0; i < settled; i++) if (typed[i] === target[i]) correctNow++;
  if (correctNow > lastCorrect) SFX.tick();
  lastCorrect = correctNow;

  // 고스트용 기록: 칸마다 처음 도착한 시간 (지우면 기록도 같이 지워요)
  if (startTime) {
    const elapsed = Date.now() - startTime;
    if (settled < marks.length) marks.length = Math.max(settled, 0);
    while (marks.length < settled) marks.push(elapsed);
  }

  sheet.innerHTML = "";
  target.forEach((ch, i) => {
    const cell = document.createElement("div");
    cell.className = "cell";
    let shown = ch;
    if (i < settled) {
      if (typed[i] === ch) {
        cell.classList.add("ok");
      } else {
        cell.classList.add("bad");
        shown = typed[i] === " " ? "_" : typed[i];
      }
    } else if (composing && i === typed.length - 1) {
      cell.classList.add("composing");
      shown = typed[i];
    }
    if (i === nowPos) cell.classList.add("now");
    cell.textContent = shown === " " ? "\u00A0" : shown;
    sheet.appendChild(cell);
  });
  cells = Array.from(sheet.children);
  updateGhost();
  $("nextLine").textContent = (kind === "long" && index + 1 < lines.length) ? "다음 줄: " + lines[index + 1] : "";
  $("progress").textContent = (index + 1) + "/" + lines.length;
  updateStats();
}

function measure() {
  const target = Array.from(lines[index]);
  const typed = Array.from(input.value);
  const settled = composing ? typed.length - 1 : typed.length;
  let correctText = "", correct = 0;
  for (let i = 0; i < settled; i++) {
    if (typed[i] === target[i]) { correct++; correctText += typed[i]; }
  }
  const acc = settled > 0 ? Math.round(correct / settled * 100) : 100;
  let cpm = 0;
  if (startTime) {
    const minutes = (Date.now() - startTime) / 60000;
    if (minutes > 0.02) cpm = Math.round(strokeCount(correctText) / minutes);
  }
  return { cpm, acc, typedLen: typed.length, targetLen: target.length };
}

function updateStats() {
  if ($("play").hidden || !$("summary").hidden) return;
  const m = measure();
  $("cpm").textContent = m.cpm;
  $("acc").textContent = m.acc;
}

const MAX_REAL_CPM = 1200;   // ★ 이보다 빠르면 복붙으로 보고 기록 안 함

function finishLine() {
  composing = false;
  const m = measure();
  if (m.typedLen === 0) { msg.textContent = "따라 친 다음 눌러 주세요."; return; }
  if (m.typedLen < m.targetLen) { msg.textContent = "아직 칠 글자가 남았어요."; return; }
  // 사람이 칠 수 없을 만큼 빠르면 기록하지 않고 다시 치게 해요
  if (m.cpm > MAX_REAL_CPM) {
    msg.textContent = "⚠️ " + m.cpm + "타는 사람이 칠 수 없는 속도예요. 이 줄은 다시 쳐 주세요!";
    input.value = ""; startTime = null; marks = []; lastCorrect = 0;
    render();
    return;
  }
  results.push({ cpm: m.cpm, acc: m.acc });
  lastCorrect = 0;

  // ----- 틀린 글자 기록 (통계의 "자주 틀리는 글자"용) -----
  const tArr = Array.from(lines[index]), yArr = Array.from(input.value);
  const miss = loadData("typing-miss", {});
  tArr.forEach((ch, i) => {
    if (yArr[i] !== undefined && yArr[i] !== ch) {
      const k = ch === " " ? "␣" : ch;
      miss[k] = (miss[k] || 0) + 1;
    }
  });
  saveData("typing-miss", miss);

  // ----- 고스트 대결 결과 -----
  const total = Date.now() - startTime;
  sessionMs += total;
  let ghostMsg = "";
  let won = false;
  if (ghost) {
    if (total < ghost.total) {
      won = true; ghostWins++;
      ghostMsg = " · 👻 과거의 나를 이겼어요! " + sec(ghost.total) + "초 → " + sec(total) + "초";
    } else {
      ghostLosses++;
      ghostMsg = " · 👻 아깝다! " + sec(total - ghost.total) + "초 차이";
    }
  }
  // 더 빠르고 정확하면 새 고스트로 저장
  if (m.acc >= GHOST_MIN_ACC && (!ghost || total < ghost.total)) {
    const rec = marks.slice(0, m.targetLen);
    while (rec.length < m.targetLen) rec.push(total);
    saveGhost(lines[index], { total, marks: rec, at: Date.now() });
    if (!ghost && ghostOn) ghostMsg = " · 👻 이 기록이 고스트가 됐어요";
  }
  if (ghost) {
    const gs = loadData("typing-ghost-stats", { win: 0, lose: 0 });
    if (won) gs.win++; else gs.lose++;
    saveData("typing-ghost-stats", gs);
  }
  if (won) SFX.win(); else SFX.line();

  msg.textContent = "방금 줄: " + m.cpm + "타, 정확도 " + m.acc + "%" + ghostMsg;
  index++;
  if (index >= lines.length) { showSummary(); return; }
  input.value = "";
  startTime = null;
  prepareLine();
  render();
  input.focus();
}

function showSummary() {
  const avgCpm = Math.round(results.reduce((a, r) => a + r.cpm, 0) / results.length);
  const avgAcc = Math.round(results.reduce((a, r) => a + r.acc, 0) / results.length);
  const key = bestKey();
  const best = loadBest(key);
  let bestText = "최고 기록: " + Math.max(best, avgCpm) + "타";
  if (avgCpm > best) { bestText += " (새 기록!)"; saveBest(key, avgCpm); }
  $("sumCpm").textContent = "평균 타수: " + avgCpm + "타";
  $("sumAcc").textContent = "평균 정확도: " + avgAcc + "%";
  $("sumBest").textContent = bestText;
  const recordTime = Date.now();
  pushData("typing-history", {
    t: recordTime, kind, lang: kind === "mine" ? "mine" : lang,
    title: $("pieceTitle").textContent, cpm: avgCpm, acc: avgAcc, lines: results.length, ms: sessionMs
  });
  $("sumGhost").textContent = (ghostWins + ghostLosses) > 0
    ? "👻 고스트 대결: " + ghostWins + "승 " + ghostLosses + "패" : "";
  $("ghostInfo").textContent = "";
  $("summary").hidden = false;
  $("practice").hidden = true;
  input.hidden = true;
  $("playButtons").hidden = true;
}

// ======================= 게임: 타자 디펜스 =======================
const MAX_HP = 5;          // ★ 성의 하트 개수
const LANES = 4;           // ★ 몬스터가 다니는 길 개수
const MAX_ENEMIES = 6;     // ★ 화면에 동시에 나오는 최대 몬스터 수
const KILLS_PER_LEVEL = 8; // ★ 몇 마리 잡으면 레벨 업
const CASTLE_X = 0.13;     // 성의 오른쪽 끝 위치 (화면 가로의 13%)
const MONSTERS = ["👾", "👻", "🐛", "🦇", "🐙", "🦂", "🐌", "🦖"];

// ★ 1, 2레벨만 따로 조금 어렵게 (3레벨부터는 아래 계산식 그대로)
const EARLY_LEVELS = {
  1: { speed: 0.074, delay: 2.2 },
  2: { speed: 0.078, delay: 2.15 }
};

// ★ 특수 몬스터: 잡으면 좋은 일이 생기고, 성에 닿아도 하트가 안 줄어요
const SPECIAL_CHANCE = 0.12;   // 12% 확률로 등장
const SPECIALS = [
  { type: "heal", icon: "💖", text: "하트 회복!" },
  { type: "ice",  icon: "❄️", text: "얼음! 4초 동안 느려져요" },
  { type: "bomb", icon: "💣", text: "펑!" },
  { type: "gold", icon: "⭐", text: "황금! 점수 3배" }
];
const FREEZE_TIME = 4;         // 얼음 지속 시간(초)
const FREEZE_SLOW = 0.4;       // 얼음일 때 속도 (0.4 = 40%)

const field = $("field"), gameInput = $("gameInput");
let g = null;   // 게임 상태를 담는 상자 (파이썬의 딕셔너리 같은 것)

function openDefense() {
  showScreen("game");
  clearField();
  g = null;
  $("hp").textContent = "♥".repeat(MAX_HP);
  $("gScore").textContent = 0;
  $("gLevel").textContent = 1;
  $("gCombo").textContent = "";
  showOverlay("타자 디펜스",
    "단어를 치고 띄어쓰기나 엔터로 공격! 💖회복 ❄️얼음 💣폭탄 ⭐황금 몬스터를 잡으면 좋은 일이 생겨요.",
    "시작하기", startDefense, null);
}

function clearField() {
  field.querySelectorAll(".enemy, .shot").forEach((el) => el.remove());
}

// 가운데 안내창 (시작, 일시정지, 게임 오버에 같이 써요)
function showOverlay(title, text, mainLabel, mainAction, showSub) {
  $("ovTitle").textContent = title;
  $("ovText").textContent = text;
  $("btnOvMain").textContent = mainLabel;
  $("btnOvMain").onclick = mainAction;
  $("btnOvSub").hidden = !showSub;
  $("overlay").hidden = false;
}

function startDefense() {
  clearField();
  g = {
    enemies: [], score: 0, hp: MAX_HP, level: 1, kills: 0, combo: 0,
    spawnTimer: 0.3, last: performance.now(), running: true, lastLane: -1, freeze: 0
  };
  field.classList.remove("frozen");
  $("overlay").hidden = true;
  gameInput.value = "";
  updateHud();
  gameInput.focus();
  requestAnimationFrame(loop);
}

function stopDefense() {
  if (g) g.running = false;
}

function updateHud() {
  $("hp").textContent = "♥".repeat(g.hp) + "♡".repeat(MAX_HP - g.hp);
  $("gScore").textContent = g.score;
  $("gLevel").textContent = g.level;
  $("gCombo").textContent = g.combo >= 2 ? g.combo + " 콤보" : "";
}

// 레벨이 오를수록 빨라지고 자주 나와요
function enemySpeed() {   // 1초에 화면의 몇 %를 가는지
  if (EARLY_LEVELS[g.level]) return EARLY_LEVELS[g.level].speed;
  return 0.065 * Math.pow(1.12, g.level - 1);
}
function spawnDelay() {   // 몇 초마다 나오는지
  if (EARLY_LEVELS[g.level]) return EARLY_LEVELS[g.level].delay;
  return Math.max(0.9, 2.6 * Math.pow(0.9, g.level - 1));
}

function pickWord() {
  const tiers = WORDS[lang];
  const maxTier = Math.min(tiers.length - 1, Math.floor((g.level - 1) / 2));
  const tier = Math.random() < 0.6 ? maxTier : Math.floor(Math.random() * (maxTier + 1));
  const onScreen = g.enemies.map((e) => e.word);
  const choices = tiers[tier].filter((w) => !onScreen.includes(w));   // 화면에 있는 단어는 빼기
  const pool = choices.length ? choices : tiers[tier];
  return pool[Math.floor(Math.random() * pool.length)];
}

function spawn() {
  let lane;
  do { lane = Math.floor(Math.random() * LANES); } while (lane === g.lastLane);
  g.lastLane = lane;
  const el = document.createElement("div");
  el.className = "enemy";
  el.innerHTML = '<span class="mon"></span><span class="word"></span>';
  const word = pickWord();
  // 특수 몬스터 뽑기 (하트가 꽉 차 있으면 회복 몬스터는 안 나와요)
  let special = null;
  if (Math.random() < SPECIAL_CHANCE) {
    const pool = SPECIALS.filter((sp) => sp.type !== "heal" || g.hp < MAX_HP);
    special = pool[Math.floor(Math.random() * pool.length)];
    el.classList.add("special");
  }
  el.querySelector(".mon").textContent = special ? special.icon : MONSTERS[Math.floor(Math.random() * MONSTERS.length)];
  el.querySelector(".word").textContent = word;
  el.style.top = (6 + (lane + 0.5) / LANES * 80) + "%";   // 땅(아래쪽)에 안 겹치게 6%~86% 사이
  el.style.left = "100%";
  field.appendChild(el);
  g.enemies.push({ word, lane, el, special, x: 1, speed: enemySpeed() * (0.85 + Math.random() * 0.3) });
}

// 매 프레임마다 실행되는 게임의 심장
function loop(now) {
  if (!g || !g.running) return;
  const dt = Math.min((now - g.last) / 1000, 0.1);   // 지난 프레임에서 흐른 시간(초)
  g.last = now;

  g.spawnTimer -= dt;
  if (g.spawnTimer <= 0 && g.enemies.length < MAX_ENEMIES) {
    spawn();
    g.spawnTimer = spawnDelay();
  }

  // 얼음 효과 시간 줄이기
  if (g.freeze > 0) {
    g.freeze -= dt;
    if (g.freeze <= 0) field.classList.remove("frozen");
  }
  const slow = g.freeze > 0 ? FREEZE_SLOW : 1;

  // 몬스터 움직이기 (반복문 안에서 지우니까 뒤에서부터 돌아요)
  for (let i = g.enemies.length - 1; i >= 0; i--) {
    const e = g.enemies[i];
    e.x -= e.speed * slow * dt;
    if (e.x <= CASTLE_X) {
      e.el.remove();
      g.enemies.splice(i, 1);
      if (!e.special) {            // 특수 몬스터는 그냥 지나가요
        g.hp--;
        g.combo = 0;
        flash("castle", "hit");
        SFX.hurt();
        updateHud();
      }
    } else {
      e.el.style.left = (e.x * 100) + "%";
    }
  }
  highlightTargets();

  if (g.hp <= 0) { gameOver(); return; }
  requestAnimationFrame(loop);
}

// 지금 치고 있는 글자로 시작하는 몬스터를 노랗게 표시
function highlightTargets() {
  const typed = gameInput.value.trim();
  g.enemies.forEach((e) => e.el.classList.toggle("target", typed.length > 0 && e.word.startsWith(typed)));
}

function flash(id, cls) {
  const el = $(id);
  el.classList.add(cls);
  setTimeout(() => el.classList.remove(cls), 180);
}

function showToast(text) {
  const t = $("toast");
  t.textContent = text;
  t.hidden = false;
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => { t.hidden = true; }, 1000);
}

// 단어를 입력하고 공격!
function fire(text) {
  if (!g || !g.running) return;
  const word = text.trim();
  if (!word) return;
  const hits = g.enemies.filter((e) => e.word === word);
  if (hits.length === 0) {                       // 틀림
    g.combo = 0;
    updateHud();
    gameInput.classList.remove("shake");
    void gameInput.offsetWidth;                  // 애니메이션 다시 틀기 위한 요령
    gameInput.classList.add("shake");
    return;
  }
  // 같은 단어가 여러 마리면 성에 제일 가까운 놈부터
  const target = hits.reduce((a, b) => (a.x < b.x ? a : b));
  g.combo++;
  const oldLevel = g.level;
  let points = killEnemy(target, true);

  if (target.special) {
    const sp = target.special;
    if (sp.type === "heal") {
      g.hp = Math.min(MAX_HP, g.hp + 1);
    } else if (sp.type === "ice") {
      g.freeze = FREEZE_TIME;
      field.classList.add("frozen");
    } else if (sp.type === "bomb") {
      const others = g.enemies.slice();          // 화면의 나머지 몬스터 전부
      others.forEach((e) => { points += killEnemy(e, false); });
      showToast("펑! " + (others.length + 1) + "마리 한 번에");
    } else if (sp.type === "gold") {
      points *= 3;
    }
    if (sp.type !== "bomb") showToast(sp.text);
    SFX.special();
  } else {
    SFX.kill();
  }

  g.score += points;
  g.level = 1 + Math.floor(g.kills / KILLS_PER_LEVEL);   // 잡은 수로 레벨 계산
  if (g.level > oldLevel) {
    showToast("레벨 업! Lv " + g.level);
    setTimeout(SFX.levelUp, 150);
  }
  updateHud();
}

// 몬스터 한 마리 처치하고 점수를 돌려줘요 (withShot이 true면 레이저 그리기)
function killEnemy(target, withShot) {
  g.enemies.splice(g.enemies.indexOf(target), 1);
  if (withShot) {
    const shot = document.createElement("div");
    shot.className = "shot";
    shot.style.left = (CASTLE_X * 100) + "%";
    shot.style.top = target.el.style.top;
    shot.style.width = ((target.x - CASTLE_X) * 100) + "%";
    field.appendChild(shot);
    setTimeout(() => shot.remove(), 200);
    flash("castle", "fire");
  }
  target.el.classList.add("dead");
  setTimeout(() => target.el.remove(), 300);
  g.kills++;
  const bonus = 1 + Math.min(g.combo, 10) * 0.1;   // 콤보가 쌓이면 점수가 최대 2배
  return Math.round(strokeCount(target.word) * 10 * bonus);
}

function gameOver() {
  g.running = false;
  const recordTime = Date.now();
  pushData("typing-games", { t: recordTime, lang, score: g.score, level: g.level, kills: g.kills });
  const key = "typing-defense-" + lang;
  const best = loadBest(key);
  let text = g.level + "레벨까지 " + g.kills + "마리를 막았어요. 점수 " + g.score + "점";
  if (g.score > best) { text += " · 새 기록!"; saveBest(key, g.score); }
  else text += " · 최고 " + best + "점";
  showOverlay("게임 오버", text, "다시 하기", startDefense, true);
}

function pauseDefense() {
  if (!g || !g.running) return;
  g.running = false;
  field.classList.toggle("frozen", g.freeze > 0);
  showOverlay("잠깐 멈춤", "준비되면 계속하기를 눌러요.", "계속하기", resumeDefense, true);
}
function resumeDefense() {
  $("overlay").hidden = true;
  g.running = true;
  g.last = performance.now();
  gameInput.focus();
  requestAnimationFrame(loop);
}

const CHAIN_START_TIME = 15;   // ★ 처음 제한 시간(초)
const CHAIN_MIN_TIME = 6;      // ★ 가장 짧은 제한 시간(초)
const CHAIN_TIME_STEP = 0.5;   // ★ 한 번 주고받을 때마다 줄어드는 시간(초)
const SURRENDER_BONUS = 300;   // ★ 컴퓨터가 항복하면 받는 보너스

// ----- 한글 글자 쪼개기 / 합치기 -----
// "강" = 첫소리 ㄱ(0) + 가운데 ㅏ(0) + 받침 ㅇ(21)
function splitSyl(ch) {
  const c = ch.charCodeAt(0) - 0xAC00;
  if (c < 0 || c > 11171) return null;
  return { cho: Math.floor(c / 588), jung: Math.floor((c % 588) / 28), jong: c % 28 };
}
function joinSyl(cho, jung, jong) {
  return String.fromCharCode(0xAC00 + cho * 588 + jung * 28 + jong);
}
// 두음법칙: 력 → 역, 로 → 노, 녀 → 여 처럼 바꿔도 되는 글자
const Y_VOWELS = [2, 3, 6, 7, 12, 17, 20];   // ㅑ ㅒ ㅕ ㅖ ㅛ ㅠ ㅣ
function dueum(ch) {
  const s = splitSyl(ch);
  if (!s) return null;
  if (s.cho === 5) return joinSyl(Y_VOWELS.includes(s.jung) ? 11 : 2, s.jung, s.jong);   // ㄹ → ㅇ 또는 ㄴ
  if (s.cho === 2 && Y_VOWELS.includes(s.jung)) return joinSyl(11, s.jung, s.jong);       // ㄴ → ㅇ
  return null;
}
// 이 글자 다음에 시작할 수 있는 글자들
function startOptions(lastChar) {
  const alt = dueum(lastChar);
  return alt ? [lastChar, alt] : [lastChar];
}

// ----- 컴퓨터 단어장 (기본 단어 + 사용자에게 배운 단어) -----
// 예전 버전에서 자동으로 배운 이상한 단어들은 지워요
try { localStorage.removeItem("typing-chain-learned"); } catch (e) {}

// 기본 단어에 나오는 글자 모음 ("린풉닫"의 "풉"처럼 이상한 글자를 걸러내는 데 써요)
const BASE_SYLLABLES = new Set(CHAIN_WORDS.join(""));
const MAX_MY_WORDS = 300;   // ★ 내 단어장 최대 개수

function loadMyWords() { return loadData("typing-chain-mywords", []); }
function chainDict() {
  const all = new Set(CHAIN_WORDS.concat(loadMyWords()));
  const byFirst = {};                        // 첫 글자별로 모아 두기
  all.forEach((w) => { (byFirst[w[0]] = byFirst[w[0]] || []).push(w); });
  return { all, byFirst };
}

let c = null;   // 끝말잇기 상태
const chainLog = $("chainLog"), chainInput = $("chainInput");

  $("wordBook").hidden = true;
  showScreen("chain");
  stopChain();

    "두음법칙(력→역, 로→노)도 돼요. 시간은 점점 줄어들고, 컴퓨터가 이을 단어가 없으면 항복해요. " +
    "컴퓨터 사전에 없는 단어는 점수가 절반이고, 그 단어로는 컴퓨터를 항복시킬 수 없어요. " +
    "자주 쓰는 단어는 📖 내 단어장에 넣어 두면 점수도 다 받고 컴퓨터도 써요.";
  $("btnChainStart").textContent = "시작하기";
  $("cOver").hidden = false;
  chainInput.hidden = true;
}

function startChain() {
  $("wordBook").hidden = true;
  c = { lastUnknown: false, dict: chainDict(), used: new Set(), score: 0, rounds: 0, wins: 0,
        limit: CHAIN_START_TIME, left: CHAIN_START_TIME, turn: "cpu", next: null, last: performance.now(), running: true };
  chainLog.innerHTML = "";
  $("cOver").hidden = true;
  chainInput.hidden = false;
  chainInput.value = "";
  $("cMsg").textContent = "";
  updateChainHud();
  chainInput.focus();
  cpuTurn(true);
  requestAnimationFrame(chainLoop);
}

function stopChain() { if (c) c.running = false; }

function updateChainHud() {
  $("cScore").textContent = c.score;
  $("cRound").textContent = c.rounds;
  $("cWins").textContent = c.wins ? "🏳️ 항복 " + c.wins + "번" : "";
}

// 말풍선 추가 (마지막 글자는 빨갛게)
function addBubble(who, word, note) {
  const div = document.createElement("div");
  div.className = "bubble " + who;
  if (who === "sys") {
    div.textContent = word;
  } else {
    const head = document.createTextNode(word.slice(0, -1));
    const tail = document.createElement("b");
    tail.textContent = word.slice(-1);
    div.append(head, tail);
    if (note) { const sm = document.createElement("small"); sm.textContent = note; div.append(sm); }
  }
  chainLog.appendChild(div);
  chainLog.scrollTop = chainLog.scrollHeight;
}

// 다음에 칠 글자 보여주기
function setNext(word) {
  const opts = startOptions(word.slice(-1));
  c.next = opts;
  $("cNext").textContent = opts[0];
  $("cHint").textContent = opts.length > 1 ? "'" + opts[1] + "'(으)로 시작해도 돼요" : "이 글자로 시작하는 단어를 쳐요";
}

// 컴퓨터 차례: first가 true면 아무 단어로 시작
function cpuTurn(first) {
  c.turn = "cpu";
  $("cHint").textContent = "컴퓨터가 생각 중…";
  setTimeout(() => {
    if (!c || !c.running) return;
    let pool;
    if (first) {
      pool = Array.from(c.dict.all).filter((w) => !c.used.has(w) && (c.dict.byFirst[w.slice(-1)] || []).length > 0);
    } else {
      pool = [];
      c.next.forEach((ch) => (c.dict.byFirst[ch] || []).forEach((w) => { if (!c.used.has(w)) pool.push(w); }));
    }
    if (pool.length === 0 && !first && c.lastUnknown) {
      // 사전 밖 단어로는 항복시킬 수 없어요 (지어낸 단어로 이기는 것 방지)
      addBubble("sys", "🤔 그 단어는 몰라서 이을 수가 없어요. 새 단어로 다시 시작!");
      setTimeout(() => cpuTurn(true), 900);
      return;
    }
    if (pool.length === 0) {                      // 이을 단어가 없음 → 항복
      c.wins++;
      c.score += SURRENDER_BONUS;
      addBubble("sys", "🏳️ 컴퓨터가 항복했어요! +" + SURRENDER_BONUS + "점");
      SFX.win();
      updateChainHud();
      setTimeout(() => cpuTurn(true), 900);      // 새 단어로 다시 시작
      return;
    }
    // 10번 넘게 주고받으면 컴퓨터가 가끔 이어 가기 어려운 단어를 골라요
    let word;
    if (c.rounds >= 10 && Math.random() < 0.5) {
      const hardness = (w) => startOptions(w.slice(-1)).reduce((n, ch) => n + (c.dict.byFirst[ch] || []).length, 0);
      pool.sort((a, b) => hardness(a) - hardness(b));
      word = pool[Math.floor(Math.random() * Math.min(3, pool.length))];
    } else {
      word = pool[Math.floor(Math.random() * pool.length)];
    }
    c.used.add(word);
    addBubble("cpu", word);
    setNext(word);
    c.turn = "me";
    c.left = c.limit;
    c.last = performance.now();
  }, 600 + Math.random() * 600);
}

// 내 단어 제출
function submitChain(text) {
  if (!c || !c.running) return;
  const w = text.trim();
  if (!w) return;
  const m = $("cMsg");
  m.classList.add("err");
  if (c.turn !== "me") { m.textContent = "컴퓨터 차례예요. 잠깐만요!"; return; }
  let err = null;
  if (!/^[가-힣]{2,6}$/.test(w)) err = "한글 2~6글자 단어를 입력해요.";
  else if (!c.next.includes(w[0])) err = "'" + c.next.join("' 또는 '") + "'(으)로 시작해야 해요.";
  else if (c.used.has(w)) err = "이미 나온 단어예요.";
  else if (new Set(w).size === 1 || /(.)\1\1/.test(w)) err = "같은 글자만 반복한 건 안 돼요.";
  else if (!c.dict.all.has(w)) {
    // 사전에 없어도 흔한 글자로만 된 단어는 받아 줘요 ("구치소"는 통과, "린듐"은 거절)
    const odd = Array.from(w).filter((ch) => !BASE_SYLLABLES.has(ch));
    if (odd.length) err = "'" + odd.join("', '") + "'처럼 거의 안 쓰는 글자가 있어요. 진짜 단어 맞아요?";
  }
  if (err) {
    m.textContent = err;
    chainInput.classList.remove("shake");
    void chainInput.offsetWidth;
    chainInput.classList.add("shake");
    return;
  }
  m.textContent = "";
  m.classList.remove("err");
  c.used.add(w);
  c.rounds++;
  const known = c.dict.all.has(w);
  c.lastUnknown = !known;                       // 사전 밖 단어였는지 기억 (항복 판정에 써요)
  let points = strokeCount(w) * 10 + Math.floor(c.left) * 5;   // 빨리 칠수록 보너스
  if (!known) points = Math.round(points / 2);  // 사전 밖 단어는 점수 절반
  c.score += points;
  let note = "+" + points + (known ? "" : " · 사전 밖");
  addBubble("me", w, note);
  SFX.kill();
  c.limit = Math.max(CHAIN_MIN_TIME, c.limit - CHAIN_TIME_STEP);
  updateChainHud();
  setNext(w);
  cpuTurn(false);
}

// 시간 재기
function chainLoop(now) {
  if (!c || !c.running) return;
  const dt = (now - c.last) / 1000;
  c.last = now;
  if (c.turn === "me") {
    c.left -= dt;
    $("cTimer").style.width = Math.max(0, c.left / c.limit * 100) + "%";
    $("cTimerBox").classList.toggle("warn", c.left < 3);
    if (c.left <= 0) { chainOver(); return; }
  }
  requestAnimationFrame(chainLoop);
}

// ----- 내 단어장 -----
// 이상한 단어 거르기: 문제가 있으면 이유를, 괜찮으면 null
function checkWord(w, mine) {
  if (!/^[가-힣]{2,6}$/.test(w)) return "한글 2~6글자 단어만 넣을 수 있어요.";
  if (CHAIN_WORDS.includes(w)) return "컴퓨터가 이미 아는 단어예요.";
  if (mine.includes(w)) return "이미 넣은 단어예요.";
  if (new Set(w).size === 1 || /(.)\1\1/.test(w)) return "같은 글자만 반복한 건 안 돼요.";
  const odd = Array.from(w).filter((ch) => !BASE_SYLLABLES.has(ch));
  if (odd.length) return "'" + odd.join("', '") + "'처럼 거의 안 쓰는 글자가 들어 있어서 넣을 수 없어요.";
  if (mine.length >= MAX_MY_WORDS) return "단어장이 꽉 찼어요. 몇 개 지우고 넣어 주세요.";
  return null;
}
function renderWordBook() {
  const list = loadMyWords();
  const ol = $("wordList");
  ol.innerHTML = "";
  list.forEach((w, i) => {
    const li = document.createElement("li");
    li.innerHTML = '<span class="num"></span><span class="text"></span><button>삭제</button>';
    li.querySelector(".num").textContent = i + 1;
    li.querySelector(".text").textContent = w;
    li.querySelector("button").addEventListener("click", () => {
      const now = loadMyWords();
      now.splice(i, 1);
      saveData("typing-chain-mywords", now);
      renderWordBook();
    });
    ol.appendChild(li);
  });
}
function addWord() {
  const box = $("wordInput"), m = $("wordMsg");
  const w = box.value.trim();
  const list = loadMyWords();
  const err = checkWord(w, list);
  if (err) { m.textContent = err; m.classList.add("err"); return; }
  list.push(w);
  saveData("typing-chain-mywords", list);
  m.textContent = "'" + w + "' 넣었어요!";
  m.classList.remove("err");
  box.value = "";
  renderWordBook();
  box.focus();
}

function chainOver() {
  c.running = false;
  SFX.hurt();
  addBubble("sys", "⏰ 시간 초과!");

  let text = c.rounds + "단어를 이었고 컴퓨터를 " + c.wins + "번 항복시켰어요. 점수 " + c.score + "점";
  if (c.score > best) { text += " · 새 기록!"; saveBest("typing-chain-best", c.score); }
  else text += " · 최고 " + best + "점";

// ======================= 통계 화면 =======================
const avg = (arr) => arr.length ? Math.round(arr.reduce((a, b) => a + b, 0) / arr.length) : 0;
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const dateText = (t) => { const d = new Date(t); return (d.getMonth() + 1) + "/" + d.getDate(); };
const LANG_NAME = { ko: "한글", en: "영어", mine: "내 문장" };

function showStats() {
  showScreen("stats");
  renderStats();
}

function renderStats() {
  const hist = loadData("typing-history", []);
  const games = loadData("typing-games", []);
  const miss = loadData("typing-miss", {});
  const gs = loadData("typing-ghost-stats", { win: 0, lose: 0 });
  let html = "";

  const chains = loadData("typing-chains", []);
  if (!hist.length && !games.length && !chains.length) {
    $("statsBody").innerHTML = '<div class="card"><h3>아직 기록이 없어요</h3>' +
      '<p class="note">연습을 끝까지 하거나 게임을 한 판 하면 여기에 통계가 쌓여요.</p></div>';
    return;
  }

  // 1) 한눈에 보기
  const cpms = hist.map((h) => h.cpm);
  const minutes = Math.round(hist.reduce((a, h) => a + (h.ms || 0), 0) / 60000);
  html += '<div class="card"><h3>한눈에 보기</h3><div class="stat-grid">' +
    '<div><b>' + hist.length + '</b><span>연습 횟수</span></div>' +
    '<div><b>' + minutes + '분</b><span>총 연습 시간</span></div>' +
    '<div><b>' + (cpms.length ? Math.max(...cpms) : 0) + '</b><span>최고 타수</span></div>' +
    '<div><b>' + avg(cpms) + '</b><span>평균 타수</span></div>' +
    '<div><b>' + avg(hist.map((h) => h.acc)) + '%</b><span>평균 정확도</span></div>' +
    '<div><b>' + gs.win + '승 ' + gs.lose + '패</b><span>고스트 전적</span></div>' +
    '</div></div>';

  // 2) 타수 변화 그래프 (최근 20번)
  if (hist.length >= 2) {
    const recent = hist.slice(-20);
    const W = 300, H = 120, P = 22;                 // 그림 크기와 여백
    const vals = recent.map((h) => h.cpm);
    const max = Math.max(...vals), min = Math.min(...vals);
    const range = Math.max(max - min, 10);
    const xy = vals.map((v, i) => [
      P + i * (W - P * 2) / (vals.length - 1),
      H - P - (v - min) / range * (H - P * 2)
    ]);
    let svg = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="최근 타수 변화">';
    svg += '<line class="axis" x1="' + P + '" y1="' + (H - P) + '" x2="' + (W - P) + '" y2="' + (H - P) + '"/>';
    svg += '<line class="axis" x1="' + P + '" y1="' + P + '" x2="' + (W - P) + '" y2="' + P + '"/>';
    svg += '<text x="2" y="' + (P + 3) + '">' + (min + range) + '</text>';
    svg += '<text x="2" y="' + (H - P + 3) + '">' + min + '</text>';
    svg += '<polyline class="line" points="' + xy.map((p) => p.join(",")).join(" ") + '"/>';
    xy.forEach((p) => { svg += '<circle class="dot" cx="' + p[0] + '" cy="' + p[1] + '" r="2.8"/>'; });
    svg += '</svg>';
    const first = avg(vals.slice(0, Math.ceil(vals.length / 2)));
    const last = avg(vals.slice(Math.floor(vals.length / 2)));
    const trend = last > first ? "📈 앞쪽보다 평균 " + (last - first) + "타 늘었어요!"
                : last < first ? "요즘 평균이 " + (first - last) + "타 줄었어요. 조금만 더 힘내요!"
                : "꾸준히 비슷한 속도예요.";
    html += '<div class="card"><h3>타수 변화</h3>' + svg +
      '<p class="note">최근 ' + vals.length + '번 연습 · ' + trend + '</p></div>';
  }

  // 3) 모드별 비교
  html += '<div class="card"><h3>모드별</h3><div class="table-wrap"><table>' +
    '<tr><th>모드</th><th class="num">횟수</th><th class="num">평균 타수</th><th class="num">평균 정확도</th></tr>';
  ["ko", "en", "mine"].forEach((l) => {
    const part = hist.filter((h) => h.lang === l);
    if (!part.length) return;
    html += '<tr><td>' + LANG_NAME[l] + '</td><td class="num">' + part.length + '</td><td class="num">' +
      avg(part.map((h) => h.cpm)) + '</td><td class="num">' + avg(part.map((h) => h.acc)) + '%</td></tr>';
  });
  html += '</table></div></div>';

  // 4) 자주 틀리는 글자 TOP 5
  const missTop = Object.entries(miss).sort((a, b) => b[1] - a[1]).slice(0, 5);
  if (missTop.length) {
    html += '<div class="card"><h3>자주 틀리는 글자</h3><div class="chips">';
    missTop.forEach(([ch, n]) => { html += '<span><b>' + esc(ch) + '</b><small>' + n + '번</small></span>'; });
    html += '</div><p class="note">␣ 는 띄어쓰기예요. 이 글자들이 들어간 문장을 내 문장에 넣어서 집중 연습해 보세요.</p></div>';
  }

  // 5) 타자 디펜스
  if (games.length) {
    html += '<div class="card"><h3>타자 디펜스</h3><div class="stat-grid">' +
      '<div><b>' + games.length + '</b><span>플레이 판 수</span></div>' +
      '<div><b>' + Math.max(...games.map((x) => x.score)) + '</b><span>최고 점수</span></div>' +
      '<div><b>Lv ' + Math.max(...games.map((x) => x.level)) + '</b><span>최고 레벨</span></div>' +
      '<div><b>' + games.reduce((a, x) => a + x.kills, 0) + '</b><span>총 처치 수</span></div>' +
      '<div><b>' + avg(games.map((x) => x.score)) + '</b><span>평균 점수</span></div>' +
      '<div><b>' + dateText(games[games.length - 1].t) + '</b><span>마지막 플레이</span></div>' +
      '</div></div>';
  }

  // 6) 끝말잇기 배틀
  if (chains.length) {
    html += '<div class="card"><h3>끝말잇기 배틀</h3><div class="stat-grid">' +
      '<div><b>' + chains.length + '</b><span>플레이 판 수</span></div>' +
      '<div><b>' + Math.max(...chains.map((x) => x.score)) + '</b><span>최고 점수</span></div>' +
      '<div><b>' + Math.max(...chains.map((x) => x.rounds)) + '</b><span>최장 연결</span></div>' +
      '<div><b>' + chains.reduce((a, x) => a + x.wins, 0) + '</b><span>컴퓨터 항복</span></div>' +
      '<div><b>' + loadMyWords().length + '</b><span>내 단어장</span></div>' +
      '<div><b>' + dateText(chains[chains.length - 1].t) + '</b><span>마지막 플레이</span></div>' +
      '</div></div>';
  }

  $("statsBody").innerHTML = html;
}

}

const MAX_JUMP = 3;   // ★ 한 번에 이 글자 수보다 많이 들어오면 붙여넣기로 봐요
function blockPaste(box, warnFn) {
  let prev = box.value;
  const warn = () => {
    warnFn("✋ 붙여넣기는 안 돼요. 직접 쳐 주세요!");
    box.classList.remove("shake");
    void box.offsetWidth;
    box.classList.add("shake");
  };
  // 1) 붙여넣기·끌어다 놓기 자체를 막기
  ["paste", "drop"].forEach((ev) => box.addEventListener(ev, (e) => { e.preventDefault(); warn(); }));
  box.addEventListener("beforeinput", (e) => {
    prev = box.value;   // 바뀌기 직전 값 기억 (코드로 입력창을 비운 뒤에도 정확하게)
    if (/^insertFrom(Paste|Drop|Yank)/.test(e.inputType)) { e.preventDefault(); warn(); }
  }, true);
  // 2) 키보드 클립보드 버튼처럼 몰래 들어오는 것도: 한 번에 너무 많이 늘면 되돌리기
  box.addEventListener("input", (e) => {
    const now = box.value;
    if (Array.from(now).length - Array.from(prev).length > MAX_JUMP) {
      box.value = prev;
      e.stopImmediatePropagation();   // 다른 처리(채점 등)가 실행되지 않게
      warn();
      return;
    }
    prev = now;
  }, true);
  box.addEventListener("focus", () => { prev = box.value; });
}
